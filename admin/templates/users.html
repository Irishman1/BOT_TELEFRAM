<div class="page-header"><h2>Користувачі</h2><p>Всі зареєстровані підписники</p></div>
<div class="search-bar">
  <form method="GET" style="display:flex;gap:8px;">
    <input type="text" name="q" value="{{search}}" placeholder="Пошук..." style="max-width:280px;">
    <button class="btn btn-primary" type="submit">Знайти</button>
  </form>
</div>
<div class="card">
  <div class="card-header"><h3>{{count}} користувачів</h3></div>
  <table><thead><tr><th>Користувач</th><th>Тариф</th><th>До</th><th>Статус</th><th>Дії</th></tr></thead>
  <tbody>{{rows}}</tbody></table>
</div>
