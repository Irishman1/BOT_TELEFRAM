<div class="page-header"><h2>Пользователи</h2><p>Все зарегистрированные подписчики</p></div>
<div class="search-bar">
  <form method="GET" style="display:flex;gap:8px;">
    <input type="text" name="q" value="{{search}}" placeholder="Поиск..." style="max-width:280px;">
    <button class="btn btn-primary" type="submit">Найти</button>
  </form>
</div>
<div class="card">
  <div class="card-header"><h3>{{count}} пользователей</h3></div>
  <table><thead><tr><th>Пользователь</th><th>Тариф</th><th>До</th><th>Статус</th><th>Действия</th></tr></thead>
  <tbody>{{rows}}</tbody></table>
</div>
