<div class="page-header"><h2>Платежи</h2><p>История всех транзакций</p></div>

<div class="metric-grid" style="margin-bottom:24px;">
  <div class="metric">
    <div class="metric-label">Всего собрано</div>
    <div class="metric-value">{{total_all}} €</div>
    <span class="metric-badge badge-up">за всё время</span>
  </div>
  <div class="metric">
    <div class="metric-label">В этом месяце</div>
    <div class="metric-value">{{total_month}} €</div>
    <span class="metric-badge badge-up">текущий месяц</span>
  </div>
  <div class="metric">
    <div class="metric-label">Всего платежей</div>
    <div class="metric-value">{{count_all}}</div>
    <span class="metric-badge badge-up">успешных</span>
  </div>
</div>

<div class="card">
  <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Последние 100 платежей</h3>
    <a href="/admin/export/payments.csv" class="btn-sm">⬇ Экспорт CSV</a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Дата</th>
        <th>Пользователь</th>
        <th>Тариф</th>
        <th>Сумма</th>
        <th>Статус</th>
        <th>Чек</th>
      </tr>
    </thead>
    <tbody>{{rows}}</tbody>
  </table>
</div>
