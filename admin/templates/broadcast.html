<div class="page-header"><h2>Рассылка</h2><p>Отправить сообщение подписчикам</p></div>
<div class="card card-body" style="max-width:560px;">
  {{result}}
  <form method="POST">
    <div class="form-group">
      <label>Кому отправить</label>
      <select name="target" id="bc-target" onchange="document.getElementById('bc-days-wrap').style.display=this.value==='expiring'?'block':'none'">
        <option value="all">Всем активным подписчикам</option>
        <option value="expiring">Тем, у кого подписка скоро заканчивается</option>
      </select>
    </div>
    <div class="form-group" id="bc-days-wrap" style="display:none;">
      <label>Заканчивается в течение (дней)</label>
      <input type="number" name="days" value="3" min="1" max="30">
    </div>
    <div class="form-group">
      <label>Текст сообщения</label>
      <textarea name="text" placeholder="Введите текст...&#10;&#10;Поддерживается HTML: &lt;b&gt; &lt;i&gt; &lt;a href=&quot;...&quot;&gt;" required></textarea>
      <div style="font-size:12px;color:#6b7280;margin-top:6px;">Поддерживается: &lt;b&gt; &lt;i&gt; &lt;a href="..."&gt;</div>
    </div>
    <button class="btn btn-primary" type="submit">Отправить</button>
  </form>
</div>
