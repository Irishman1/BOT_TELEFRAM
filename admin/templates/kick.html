<div class="page-header"><h2>Удалить пользователя</h2><p>Кик из группы и отмена подписки</p></div>
<div class="card card-body" style="max-width:480px;">
  {{msg}}
  <div class="alert alert-warn" style="margin-bottom:20px;">⚠️ Пользователь будет удалён из группы. Действие необратимо.</div>
  <form method="POST">
    <div class="form-group"><label>Username</label><input type="text" name="username" value="{{prefill}}" placeholder="@username" required></div>
    <button class="btn btn-danger" type="submit" style="background:#dc2626;color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;">Удалить</button>
  </form>
</div>
