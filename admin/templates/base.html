<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f6fa;--surface:#fff;--border:#e5e7ef;--text:#1a1a2e;--muted:#6b7280;--primary:#534AB7;--primary-d:#3C3489;--success:#16a34a;--danger:#dc2626;--success-bg:#dcfce7;--danger-bg:#fee2e2;--warn-bg:#fef9c3;--warn:#92400e}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto}
.logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.logo h1{font-size:15px;font-weight:600}
.logo p{font-size:12px;color:var(--muted);margin-top:2px}
.nav{padding:8px 0;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:14px;color:var(--muted);text-decoration:none;border-left:2px solid transparent;transition:all .15s}
.nav a:hover{background:var(--bg);color:var(--text)}
.nav a.active{background:#f0effe;color:var(--primary);border-left-color:var(--primary);font-weight:500}
.sidebar-footer{padding:12px 18px;border-top:1px solid var(--border)}
.sidebar-footer a{font-size:13px;color:var(--muted);text-decoration:none}
.sidebar-footer a:hover{color:var(--danger)}
.main{margin-left:220px;flex:1;padding:28px}
.page-header{margin-bottom:24px}
.page-header h2{font-size:20px;font-weight:600}
.page-header p{font-size:14px;color:var(--muted);margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card-body{padding:20px}
.card-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:14px;font-weight:500}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.metric-label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.metric-value{font-size:28px;font-weight:600;margin:6px 0 4px}
.metric-badge{font-size:12px;display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px}
.badge-up{background:var(--success-bg);color:var(--success)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:10px 16px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#fafafa}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:500}
.badge-active{background:var(--success-bg);color:var(--success)}
.badge-expired{background:var(--danger-bg);color:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;border:none;text-decoration:none;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-d)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Inter',sans-serif;text-decoration:none;display:inline-block}
.btn-sm:hover{background:var(--bg);color:var(--text)}
.btn-sm.danger{color:var(--danger);border-color:#fca5a5}
.btn-sm.danger:hover{background:var(--danger-bg)}
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
input[type=text],input[type=number],input[type=password],textarea,select{width:100%;padding:9px 12px;font-size:14px;font-family:'Inter',sans-serif;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:120px}
.alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
.alert-success{background:var(--success-bg);color:var(--success);border:1px solid #bbf7d0}
.alert-danger{background:var(--danger-bg);color:var(--danger);border:1px solid #fca5a5}
.alert-warn{background:var(--warn-bg);color:var(--warn);border:1px solid #fde68a}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.user-card-name{font-size:16px;font-weight:600;margin-bottom:12px}
.user-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.user-meta-item label{font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
.user-meta-item p{font-weight:500}
.support-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:600;margin-left:6px}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo"><h1>🤖 Bot Admin</h1><p>Панель управління</p></div>
  <nav class="nav">
    <a href="/admin/stats"     class="{{nav_stats}}">📊 Статистика</a>
    <a href="/admin/users"     class="{{nav_users}}">👥 Користувачі</a>
    <a href="/admin/find"      class="{{nav_find}}">🔍 Пошук</a>
    <a href="/admin/give"      class="{{nav_give}}">🎁 Видати доступ</a>
    <a href="/admin/kick"      class="{{nav_kick}}">🚫 Видалити</a>
    <a href="/admin/payments"  class="{{nav_payments}}">💰 Платежі</a>
    <a href="/admin/broadcast" class="{{nav_broadcast}}">📢 Розсилка</a>
    <a href="/admin/promo"     class="{{nav_promo}}">🎟 Промокоди</a>
    <a href="/admin/support"   class="{{nav_support}}">💬 Підтримка{{support_badge}}</a>
  </nav>
  <div class="sidebar-footer"><a href="/admin/logout">← Вийти</a></div>
</aside>
<main class="main">
{{content}}
</main>
</body>
</html>
