<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %} — Bot Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f6fa; --surface: #ffffff; --border: #e5e7ef;
  --text: #1a1a2e; --muted: #6b7280; --primary: #534AB7;
  --primary-dark: #3C3489; --success: #16a34a; --danger: #dc2626;
  --success-bg: #dcfce7; --danger-bg: #fee2e2;
  --warning-bg: #fef9c3; --warning: #92400e;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

.sidebar {
  width: 220px; background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; position: fixed;
  top: 0; left: 0; height: 100vh; overflow-y: auto;
}
.sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo h1 { font-size: 15px; font-weight: 600; color: var(--text); }
.sidebar-logo p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.nav { padding: 8px 0; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px; font-size: 14px; color: var(--muted);
  text-decoration: none; border-left: 2px solid transparent; transition: all 0.15s;
}
.nav a:hover { background: var(--bg); color: var(--text); }
.nav a.active { background: #f0effe; color: var(--primary); border-left-color: var(--primary); font-weight: 500; }
.nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
.sidebar-footer { padding: 12px 18px; border-top: 1px solid var(--border); }
.sidebar-footer a { font-size: 13px; color: var(--muted); text-decoration: none; }
.sidebar-footer a:hover { color: var(--danger); }

.main { margin-left: 220px; flex: 1; padding: 28px; }
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 20px; font-weight: 600; }
.page-header p { font-size: 14px; color: var(--muted); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
.card-body { padding: 20px; }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.card-header h3 { font-size: 14px; font-weight: 500; }

.metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
.metric { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.metric-label { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
.metric-value { font-size: 28px; font-weight: 600; margin: 6px 0 4px; }
.metric-badge { font-size: 12px; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; }
.badge-up { background: var(--success-bg); color: var(--success); }
.badge-warn { background: var(--warning-bg); color: var(--warning); }

.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { padding: 10px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
tbody td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: #fafafa; }

.badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.badge-active { background: var(--success-bg); color: var(--success); }
.badge-expired { background: var(--danger-bg); color: var(--danger); }
.badge-soon { background: var(--warning-bg); color: var(--warning); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; border: none; text-decoration: none; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--danger-bg); color: var(--danger); }
.btn-danger:hover { background: #fecaca; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: 'Inter', sans-serif; }
.btn-sm:hover { background: var(--bg); color: var(--text); }
.btn-sm.danger { color: var(--danger); border-color: #fca5a5; }
.btn-sm.danger:hover { background: var(--danger-bg); }

.form-group { margin-bottom: 16px; }
label { display: block; font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
input[type=text], input[type=number], input[type=password], textarea, select {
  width: 100%; padding: 9px 12px; font-size: 14px; font-family: 'Inter', sans-serif;
  border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text);
  outline: none; transition: border-color 0.15s;
}
input:focus, textarea:focus { border-color: var(--primary); }
textarea { resize: vertical; min-height: 120px; }

.alert { padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
.alert-success { background: var(--success-bg); color: var(--success); border: 1px solid #bbf7d0; }
.alert-danger  { background: var(--danger-bg);  color: var(--danger);  border: 1px solid #fca5a5; }
.alert-warn    { background: var(--warning-bg); color: var(--warning); border: 1px solid #fde68a; }

.search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
.search-bar input { max-width: 280px; }

.user-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
.user-card-name { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.user-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
.user-meta-item label { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
.user-meta-item p { font-weight: 500; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <h1>🤖 Bot Admin</h1>
    <p>Панель управління</p>
  </div>
  <nav class="nav">
    <a href="/stats" class="{{ 'active' if page == 'stats' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Статистика
    </a>
    <a href="/users" class="{{ 'active' if page == 'users' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Користувачі
    </a>
    <a href="/find" class="{{ 'active' if page == 'find' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Пошук
    </a>
    <a href="/give" class="{{ 'active' if page == 'give' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><path d="M12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
      Видати доступ
    </a>
    <a href="/kick" class="{{ 'active' if page == 'kick' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>
      Видалити
    </a>
    <a href="/broadcast" class="{{ 'active' if page == 'broadcast' }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 17H2a3 3 0 0 0 3-3V9a7 7 0 0 1 14 0v5a3 3 0 0 0 3 3zm-8.27 4a2 2 0 0 1-3.46 0"/></svg>
      Розсилка
    </a>
  </nav>
  <div class="sidebar-footer">
    <a href="/logout">← Вийти</a>
  </div>
</aside>

<main class="main">
  {% block content %}{% endblock %}
</main>

</body>
</html>
